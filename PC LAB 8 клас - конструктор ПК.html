let weights={cpu:15,ram:12,storage:9,gpu:15,hz:8,color:9,ssd:6};const items=Object.entries(m.goal).map(([k,need])=>({key:k,label:labels[k],actual:vals[k],need,ok:vals[k]>=need,score:Math.min(1,vals[k]/need),weight:weights[k]}));let totalWeight=items.reduce((s,i)=>s+i.weight,0);let fit=items.reduce((s,i)=>s+i.weight*i.score,0)/totalWeight*68;
let priceScore=p<=m.budget?15:Math.max(0,15-((p-m.budget)/m.budget)*90);let balance=12;let remarks=[];
if(m.noDiscrete&&x.gpu.discrete){balance-=10;remarks.push({good:false,text:'Для цього завдання окрема відеокарта — дорога надмірність. Інтегрована графіка зазвичай достатня.'})}if(!m.noDiscrete&&['🎨','🎬'].includes(m.emoji)&&x.gpu.perf>=90&&m.goal.gpu<=75){balance-=2;remarks.push({good:false,text:'Найдорожча графіка не завжди дає найкраще співвідношення ціни та користі.'})}if(x.psu.watt>=(x.cpu.watt+x.gpu.watt+420)){balance-=3;remarks.push({good:false,text:'Блок живлення має надмірний запас: можливо, бюджет краще витратити на важливіші компоненти.'})}if(!x.storage.ssd){balance-=5;remarks.push({good:false,text:'HDD як єдиний системний диск повільніший за SSD.'})}
let percent=Math.round(Math.max(0,Math.min(100,fit+priceScore+Math.max(0,balance)+(fatal.length?0:5)-(p>m.budget?Math.min(34,100*(p-m.budget)/m.budget):0))));if(fatal.length)percent=Math.min(percent,32);if(p>m.budget)percent=Math.min(percent,67);const unmet=items.filter(i=>!i.ok);if(unmet.length)percent=Math.min(percent,79);const grade=Math.max(1,Math.min(12,Math.floor(percent*12/100+.5)));
if(fatal.length)remarks.unshift(...fatal.map(e=>({good:false,text:'Несумісність: '+e.text.toLowerCase()+' ('+e.detail+').'})));
if(p>m.budget)remarks.push({good:false,text:'Перевищено бюджет на '+fmt(p-m.budget)+'. Спробуй знайти вигіднішу конфігурацію.'});
if(unmet.length)for(const i of unmet)remarks.push({good:false,text:'Не досягнуто вимоги «'+i.label+'»: '+formatValue(i.key,i.actual)+' замість необхідних '+formatValue(i.key,i.need)+'.'});
if(!fatal.length)remarks.push({good:true,text:'Основні компоненти сумісні між собою: сокет, пам’ять, відеовихід і запас живлення перевірено.'});
if(p<=m.budget)remarks.push({good:true,text:'Бюджету дотримано. Залишилося '+fmt(m.budget-p)+'.'});
if(!unmet.length)remarks.push({good:true,text:'Система досягає всіх навчальних цільових характеристик клієнта.'});
if(!remarks.length)remarks.push({good:true,text:'Хороша збірка! Ти врахував призначення комп’ютера.'});
return{percent,grade,price:p,goal:m.goal,items,cs,fatal,remarks,fit:Math.round(fit/68*100),budget:p<=m.budget?100:Math.max(0,Math.round(m.budget/p*100)),balance:Math.max(0,Math.round(balance/12*100)),compatible:fatal.length?0:100,ok:fatal.length===0&&p<=m.budget&&unmet.length===0,picks:{...state.picks},timestamp:new Date().toLocaleString('uk-UA')};}
function formatValue(key,val){switch(key){case'ram':case'storage':return val+' ГБ';case'hz':return val+' Гц';case'ssd':return val?'так':'ні';default:return val+' / 100'}}
function hero(){const m=missions[state.mission],p=price(),pct=Math.min(100,p/m.budget*100),c=selectedCount();return `<div class="mainhead"><section class="box hero"><div class="eyebrow">${m.level} · ЗАМОВЛЕННЯ ${String(state.mission+1).padStart(2,'0')} / ${missions.length} · ${m.client}</div><h1>${m.emoji} ${m.title}</h1><p>${m.story}</p><div class="chips"><span class="chip gold">🎯 ${m.priority}</span><span class="chip">💰 Бюджет ${fmt(m.budget)}</span><span class="chip">${m.role}</span></div></section><section class="box stats"><div><div class="stat-line"><span class="slabel">ВАРТІСТЬ ЗБІРКИ</span><span class="budget-number" style="color:${p>m.budget?'var(--red)':'var(--text)'}">${fmt(p)}</span></div><div class="bar"><i class="${p>m.budget?'over':''}" style="width:${pct}%"></i></div><div class="stat-line" style="margin-top:7px"><span class="tiny">Ліміт: ${fmt(m.budget)}</span><span class="tiny" style="color:${p>m.budget?'var(--red)':'var(--green)'}">${p>m.budget?'Перевитрата '+fmt(p-m.budget):'Залишок '+fmt(m.budget-p)}</span></div></div><div class="stats-bottom"><div class="mini-status"><span>СКЛАДОВІ</span>${c} / 7 встановлено</div><div class="mini-status"><span>ПЕРЕВІРКА</span>${checks().some(x=>!x.good)?'<span style="color:var(--red);font-size:12px">Є несумісність</span>':c===7?'<span style="color:var(--green);font-size:12px">Готово до тесту</span>':'Очікуємо збірку'}</div></div></section></div>`}
function header(){let n=Object.keys(saved.best).length;return `<header class="topbar"><div class="brand"><div class="mark">B</div><div><b>PC LAB <span style="color:var(--accent)">/ 8</span></b><small>ІНТЕРАКТИВНА МАЙСТЕРНЯ КОМП’ЮТЕРІВ</small></div></div><div class="top-actions"><span class="pill">🏅 Місій виконано: ${n} / ${missions.length}</span><button class="pill" data-action="missions">🗺️ Усі місії</button><button class="pill" data-action="report">📋 Мій журнал</button><button class="pill" data-action="sound" title="Увімкнути або вимкнути звуки">${state.muted?'🔇':'🔊'}</button></div></header><nav class="progressline" aria-label="Вибір місії">${missions.map((m,i)=>`<button class="missionchip ${i===state.mission?'active':''} ${saved.best[i]?'done':''}" data-mission="${i}" title="${m.title}"><span class="n">${saved.best[i]?'✓':i+1}</span><span>${m.emoji} ${['Офіс','Навчання','Кіберспорт','Дизайн','Монтаж','3D-центр','Економія','Фінал'][i]}</span>${saved.best[i]?`<span class="grade">${saved.best[i].grade}</span>`:''}</button>`).join('')}</nav>`}
function workspace(){const g=groups.find(x=>x.id===state.active),idx=groups.findIndex(x=>x.id===state.active);return `<section class="workspace box"><div class="section-title"><h2>🧰 Каталог комплектуючих</h2><span class="smallmeta">Навчальні ціни · без інтернету</span></div><div class="category-nav">${groups.map(x=>`<button class="category ${state.active===x.id?'active':''} ${get(x.id)?'selected':''}" data-tab="${x.id}" aria-pressed="${state.active===x.id}"><span class="cat-icon">${x.icon}</span><strong>${x.label}</strong></button>`).join('')}</div><div class="catalog-head"><div><h3>${g.icon} ${g.label}</h3><p>${g.summary}. Обери одну модель для встановлення.</p></div><div class="catalog-tag">КРОК ${idx+1} / 7</div></div><div class="tip"><span>💡</span><span><b>Лабораторна нотатка:</b> ${g.tip}</span></div><div class="component-grid">${catalog[g.id].map(c=>`<button class="component ${state.picks[g.id]===c.id?'chosen':''}" data-pick="${g.id}|${c.id}" aria-pressed="${state.picks[g.id]===c.id}"><div class="comp-top"><span class="comp-icon">${g.icon}</span><div class="comp-names"><span class="comp-name">${c.name}</span><span class="comp-type">${c.sub}</span></div></div>${state.picks[g.id]===c.id?'<span class="selected-badge">●</span>':''}<div class="comp-specs">${c.tags.map(t=>`<span class="spec">${t}</span>`).join('')}</div><div class="comp-description">${c.info}</div><div class="comp-bottom"><span class="comp-price">${fmt(c.price)}</span><span class="comp-action">${state.picks[g.id]===c.id?'✓ УСТАНОВЛЕНО':'ОБРАТИ →'}</span></div></button>`).join('')}</div><div class="workspace-footer"><button class="navbtn" data-action="prev" ${idx===0?'disabled':''}>← Попередня деталь</button><button class="navbtn primary" data-action="next">${idx===6?'🔍 До перевірки':'Наступна деталь →'}</button></div></section>`}
function right(){const cpu=get('cpu'),ram=get('ram'),gpu=get('gpu'),d=get('display'),m=missions[state.mission],cs=checks(),count=selectedCount();return `<aside class="rightstack"><section class="preview box"><div class="preview-top"><strong>🛠️ Твоя збірка</strong><span>${count===7?'УСІ ДЕТАЛІ НА МІСЦІ':`${count} ІЗ 7 ВСТАНОВЛЕНО`}</span></div><div class="pc-stage"><div class="monitor ${d?'':'off'}"><div class="screen" style="${d&&d.hz>=144?'box-shadow:inset 0 0 32px #6855d344':''}"></div><div class="stand"></div></div><div class="tower"><div class="glass"><div class="fan ${cpu?'':'dim'}"></div><div class="pc-cpu ${cpu?'':'dim'}">CPU</div><div class="ramsticks ${ram?'':'dim'}"><i></i><i></i></div><div class="gpu-plate ${gpu?.discrete?'':'dim'}"></div></div></div><div class="pc-stage-label">Віртуальний ПК · схематична візуалізація</div></div><div class="slots">${groups.map(g=>{let c=get(g.id);return `<button class="slot" style="width:100%;background:none;border-top:none;border-left:none;border-right:none;text-align:left;cursor:pointer" data-tab="${g.id}"><span class="slot-label">${g.icon} ${g.label}</span><span class="slot-val ${c?'':'empty'}">${c?c.name:'+ Встановити'}</span></button>`}).join('')}</div></section><section class="inspect box"><h3>🔍 Центр діагностики</h3><div class="checkrow ${count===7?'good':'warn'}"><i class="dot"></i><span>Комплектність</span><strong>${count}/7</strong></div>${cs.map(c=>`<div class="checkrow ${c.good?'good':'bad'}"><i class="dot"></i><span>${c.text}</span><strong>${c.good?'OK':'ПОМИЛКА'}</strong></div>`).join('')}${cs.length===0?'<div class="checkrow"><i class="dot"></i><span>Сумісність перевірятиметься автоматично</span></div>':''}<div class="checkrow ${price()<=m.budget?'good':'bad'}"><i class="dot"></i><span>Дотримання бюджету</span><strong>${price()<=m.budget?'OK':'ПЕРЕВИТРАТА'}</strong></div><button class="cta" data-action="test" ${count!==7?'disabled':''}>🚀 Запустити тестування ПК</button><button class="hint-button" data-actio function render(){el('app').innerHTML=header()+hero()+`<main class="workarea">${workspace()}${right()}</main><footer class="footer"><b>PC LAB · 8 клас · «Добір складових комп’ютера залежно від його призначення»</b><div>Ціни й бали характеристик умовні — тільки для навчального моделювання. Жодні дані не надсилаються в інтернет.</div></footer>`}

function close(){portal('');overlayType=''}
function intro(){overlayType='intro';portal(`<div class="intro-mark">⚡</div><span class="eyebrow">СИМУЛЯТОР · ІНФОРМАТИКА · 8 КЛАС</span><h2>Ти — головний інженер комп’ютерної майстерні!</h2><p>Перед тобою 8 замовлень. Добирай процесор, плату, пам’ять, накопичувач, відео, живлення та монітор. Стеж за бюджетом, сумісністю та потребами клієнта. Після запуску тесту отримай персональний аналіз і оцінку за 12-бальною шкалою.</p><div class="intro-grid"><div><b>🧩 7 деталей</b>У кожному замовленні ти збираєш повноцінну конфігурацію.</div><div><b>🚀 8 місій</b>Від офісного комп’ютера до потужної робочої станції.</div><div><b>🏆 12 балів</b>Розумний вибір цінується більше за зайві витрати.</div></div><label class="name-label" for="player">Як звати інженера? (необов’язково)</label><input class="name-input" id="player" maxlength="55" placeholder="Прізвище та ім’я" value="${escapeHtml(saved.name)}"><div class="modal-actions"><button class="cta" data-action="start">Розпочати кар’єру →</button></div><p class="tiny">Працює без інтернету. Результати зберігаються лише в цьому браузері.</p>`)}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,k=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[k]))}
function missionMenu(){overlayType='missions';portal(`<button class="closebtn" data-action="close">×</button><span class="eyebrow">КАРТА МАЙСТЕРНІ</span><h2>Обери замовлення</h2><p>Можна виконувати місії в будь-якому порядку та покращувати свій результат.</p><div class="missionmenu-grid">${missions.map((m,i)=>`<button class="menu-item" data-mission="${i}"><span class="menu-emoji">${m.emoji}</span><b>${i+1}. ${m.title}</b><small>${fmt(m.budget)} · ${saved.best[i]?'🏅 Найкраще: '+saved.best[i].grade+'/12':'Ще не виконано'}</small></button>`).join('')}</div>`)}
function test(){const result=analyze();if(!result){tone('error');return}overlayType='diagnostic';portal(`<div class="diagnostic"><div class="load-ring"></div><span class="eyebrow">PC LAB · СИСТЕМНА ДІАГНОСТИКА</span><h2>Тестуємо конфігурацію…</h2><p id="diag-text">Перевіряємо сумісність обладнання</p></div>`);const steps=['Перевіряємо сокет процесора та стандарт пам’яті…','Вимірюємо відповідність завданням клієнта…','Аналізуємо бюджет і запас живлення…','Готуємо інженерний звіт…'];steps.forEach((s,i)=>setTimeout(()=>{if(overlayType==='diagnostic'&&el('diag-text'))el('diag-text').textContent=s},(i+1)*400));setTimeout(()=>{if(overlayType!=='diagnostic')return;const key=state.mission,old=saved.best[key];if(!old||result.percent>old.percent){saved.best[key]={grade:result.grade,percent:result.percent,price:result.price,at:result.timestamp};save()}tone(result.grade>=9?'win':'error');showResult(result);render()},1950)}
function showResult(r){overlayType='result';let m=missions[state.mission],verdict=r.percent>=90?'Блискучий інженерний вибір!':r.percent>=75?'Вдалий проєкт — так тримати!':r.percent>=55?'Непогано, але є що вдосконалити':'Збірку потрібно переглянути';let blocks=[['Відповідність завданню',r.fit],['Бюджет',r.budget],['Баланс складових',r.balance],['Сумісність',r.compatible]];portal(`<button class="closebtn" data-action="close" aria-label="Закрити">×</button><span class="eyebrow">ЗВІТ ПІСЛЯ ТЕСТУВАННЯ · МІСІЯ ${state.mission+1}</span><div class="result-header"><div><h2>${m.emoji} ${verdict}</h2><div class="result-score">${r.percent} / 100 балів ефективності</div><p>${escapeHtml(saved.name||'Інженере')}, ось результати твого проєкту для замовлення «${m.title}».</p></div><div class="result-grade"><strong>${r.grade}</strong><small>з 12 балів</small></div></div><div class="resultmetrics">${blocks.map(b=>`<div class="resultmetric"><span>${b[0]}</span><b>${b[1]}%</b><div class="res-bar"><i style="width:${b[1]}%"></i></div></div>`).join('')}</div><div class="feedback"><h3>📝 Висновок інженерної комісії</h3><ul>${r.remarks.map(x=>`<li class="${x.good?'good':'bad'}">${x.good?'✓ ':'⚠ '}${x.text}</li>`).join('')}</ul></div><div class="modal-actions"><button class="cta" data-action="nextmission">${state.mission===missions.length-1?'🔁 Повернутися до першої місії':'Наступне замовлення →'}</button><button class="ghostbtn" data-action="close">🛠️ Поліпшити збірку</button><button class="ghostbtn" data-action="download">⬇️ Завантажити звіт</button><button class="ghostbtn" data-action="print">🖨️ Друк</button></div><div class="tiny" style="margin-top:16px">Оцінка = округлення результату до 12-бальної шкали (0,5 вгору). Несумісність, перевитрата або недотримання вимог обмежують підсумковий бал.</div>`);window.currentResult=r}
function report(){overlayType='report';const completed=Object.keys(saved.best).length,sum=Object.values(saved.best).reduce((s,r)=>s+r.grade,0),avg=completed?Math.round(sum/completed*10)/10:0;portal(`<button class="closebtn" data-action="close">×</button><span class="eyebrow">МОЯ КАР’ЄРА · ІНЖЕНЕРНИЙ ЖУРНАЛ</span><h2>🏅 Досягнення ${escapeHtml(saved.name||'юного інженера')}</h2><p>Твій журнал зберігається на цьому комп’ютері. Можна повернутися до будь-якої місії та покращити рекорд.</p><div class="intro-grid"><div><b>${completed} / ${missions.length}</b>Місій пройдено</div><div><b>${avg?avg:'—'}</b>Середній найкращий бал</div><div><b>${completed===missions.length?'🏆 Майстер':'⚡ У процесі'}</b>Статус кар’єри</div></div><table class="report-table"><thead><tr><th>Замовлення</th><th>Найкраща оцінка</th></tr></thead><tbody>${missions.map((m,i)=>`<tr><td>${m.emoji} ${m.title}</td><td>${saved.best[i]?saved.best[i].grade+' / 12':'—'}</td></tr>`).join('')}</tbody></table>${completed===missions.length?`<div class="certificate"><div>⬡ PC LAB ⬡</div><h3>СЕРТИФІКАТ МАЙСТРА ПК</h3><p>Нагороджується <b>${escapeHtml(saved.name||'Юний інженер')}</b><br>за виконання всіх восьми місій комп’ютерної майстерні.</p><div class="cert-grade">${avg} / 12</div><small>Добір складових комп’ютера залежно від призначення</small></div>`:''}<div class="modal-actions"><button class="cta" data-action="downloadall">⬇️ Мій журнал (TXT)</button><button class="ghostbtn" data-action="print">🖨️ Роздрукувати${completed===missions.length?' сертифікат':''}</button><button class="ghostbtn" data-action="close">Повернутися</button></div>`)}
function selectMission(i){state.mission=Math.max(0,Math.min(missions.length-1,i));state.picks={};state.active='cpu';state.hint=false;close();render();window.scrollTo({top:0,behavior:'smooth'});tone()}

function downloadOne(){const r=window.currentResult;if(!r)return;const m=missions[state.mission];const comps=groups.map(g=>`${g.label}: ${catalog[g.id].find(c=>c.id===r.picks[g.id])?.name||'не обрано'}`);downloadText(`PC_LAB_Місія_${state.mission+1}.txt`,[`PC LAB — Інженерний звіт`, `Учень: ${saved.name||'Не вказано'}`,`Місія: ${m.title}`,`Дата: ${r.timestamp}`,`Оцінка: ${r.grade}/12`,`Бал: ${r.percent}/100`,`Вартість: ${fmt(r.price)}`,`Бюджет: ${fmt(m.budget)}`,'','КОМПОНЕНТИ:',...comps,'','ВИСНОВКИ:',...r.remarks.map(x=>(x.good?'+ ':'! ')+x.text),'','Навчальні ціни умовні. Згенеровано локально в браузері.'].join('\r\n'))}
function downloadAll(){downloadText('PC_LAB_Журнал.txt',[`PC LAB — Журнал виконання`, `Учень: ${saved.name||'Не вказано'}`,`Дата: ${new Date().toLocaleString('uk-UA')}`,'',...missions.map((m,i)=>`${i+1}. ${m.title} — ${saved.best[i]?saved.best[i].grade+'/12, '+saved.best[i].percent+'/100':'не виконано'}`)].join('\r\n'))}
document.addEventListener('click',e=>{const target=e.target.closest('button');if(!target)return;let id=target.dataset.pick;if(id){const[g,c]=id.split('|');state.picks[g]=c;state.hint=false;tone();render();return}if(target.dataset.tab){state.active=target.dataset.tab;render();return}if(target.dataset.mission!==undefined){selectMission(+target.dataset.mission);return}const a=target.dataset.action;switch(a){case'missions':missionMenu();break;case'report':report();break;case'sound':state.muted=!state.muted;render();break;case'prev':state.active=groups[Math.max(0,groups.findIndex(g=>g.id===state.active)-1)].id;render();break;case'next':{let i=groups.findIndex(g=>g.id===state.active);if(i<groups.length-1){state.active=groups[i+1].id;render()}else{document.querySelector('.inspect')?.scrollIntoView({behavior:'smooth',block:'center'})}break}case'hint':state.hint=!state.hint;render();break;case'test':test();break;case'start':saved.name=(el('player')?.value||'').trim().slice(0,55);save();close();render();break;case'close':close();break;case'nextmission':selectMission((state.mission+1)%missions.length);break;case'download':downloadOne();break;case'downloadall':downloadAll();break;case'print':window.print();break;default:break}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&overlayType!=='intro')close();if(e.key==='Enter'&&overlayType==='intro'&&document.activeElement?.id==='player'){e.preventDefault();saved.name=(el('player')?.value||'').trim().slice(0,55);save();close();render()}});
render();let wasSeen=false;try{wasSeen=sessionStorage.getItem('pclab_seen')==='1';if(!wasSeen)sessionStorage.setItem('pclab_seen','1')}catch(e){}if(!saved.name&&!wasSeen)intro()
})();
</script>
